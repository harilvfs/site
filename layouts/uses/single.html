{{ define "main" }}
<div id="reading-progress" class="fixed top-0 left-0 h-1 bg-stone-800 dark:bg-stone-200 z-50 transition-none" style="width: 0%"></div>
<div class="prose prose-stone dark:prose-invert max-w-none">
  <a href="{{ .Site.Home.RelPermalink }}" class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-md border border-stone-200 dark:border-neutral-700 hover:bg-stone-100 dark:hover:bg-neutral-800 transition-colors duration-200 mb-4 no-underline" style="color: inherit;">
    <i class="bi bi-arrow-left text-[10px] opacity-60"></i> Home
  </a>
  <h1 class="top-h1">{{- .Title -}}</h1>
  {{ with .Description }}<p class="text-stone-500 dark:text-stone-400 text-sm -mt-2 mb-4">{{ . }}</p>{{ end }}
  <div class="content">
    {{ .Content }}
  </div>
</div>

<button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="fixed bottom-6 right-6 w-10 h-10 rounded-full border border-stone-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 text-stone-500 dark:text-stone-400 shadow-sm flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-stone-100 dark:hover:bg-neutral-800" style="opacity: 0; pointer-events: none;" id="uses-back-to-top">
  <i class="bi bi-arrow-up text-sm"></i>
</button>

<script>
  const bar = document.getElementById("reading-progress");
  const backToTop = document.getElementById("uses-back-to-top");
  window.addEventListener("scroll", () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    bar.style.width = progress + "%";
    if (scrollTop > 300) {
      backToTop.style.opacity = "1";
      backToTop.style.pointerEvents = "auto";
    } else {
      backToTop.style.opacity = "0";
      backToTop.style.pointerEvents = "none";
    }
  });
</script>
{{ end }}
