{{ range .Site.Data.projects.list }}
<div class="mb-3">
  <h4>
    <a href="{{ .url }}" class="inline-flex items-center gap-1">
      <i class="bi bi-github text-sm opacity-60 mr-2.5"></i>
      <span>{{- .title -}}</span>
      <span class="star-count text-[10px] px-1.5 py-0.5 rounded-full bg-stone-200 dark:bg-neutral-700 text-stone-500 dark:text-stone-400 tabular-nums" data-repo="{{ .url | strings.TrimPrefix "https://github.com/" }}"></span>
    </a>
  </h4>
  <p class="text-sm text-stone-600 dark:text-stone-400 ml-4">{{- .description | markdownify -}}</p>
</div>
{{ end }}
