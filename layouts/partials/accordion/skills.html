<script>
  let elem = document.querySelector("#skill-panel");
  if (elem) {
    let skillPanel = elem.previousElementSibling;
    skillPanel.addEventListener("click", function() {
      let skillBars = document.querySelectorAll("#skill-percent");
      skillBars.forEach(elem => {
        elem.style.width = elem.classList[0];
      });
    });
  }
</script>
{{ range .Site.Data.skills.list }}
<div class="mb-3">
  <div class="flex justify-between items-center mb-1">
    <code class="text-sm text-stone-700 dark:text-stone-300">{{ .skill }}</code>
    <span class="text-xs text-stone-400 dark:text-stone-500">{{ .skillrating }}%</span>
  </div>
  <div class="w-full h-1.5 bg-stone-200 dark:bg-neutral-800 rounded-full overflow-hidden">
    <div id="skill-percent" class="{{ .skillrating }}% bg-blue-500 dark:bg-blue-400 h-full rounded-full" style="width: 0; transition: all 0.5s;"></div>
  </div>
</div>
{{ end }}
