<div class="flex flex-wrap gap-2">
  {{ range .Site.Data.hobbies.list }}
  <span class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full border border-stone-200 dark:border-neutral-700 text-stone-600 dark:text-stone-300">
    {{ if .icon }}<i class="{{ .icon }} text-xs opacity-60"></i>{{ end }}
    {{ .hobby }}
  </span>
  {{ end }}
</div>
