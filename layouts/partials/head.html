<head>
  {{ if .IsHome }}
  <title>{{ .Site.Title }}</title>
  {{ else }}
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  {{ end }}
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  />
  <meta name="theme-color" content="" />
  <meta name="description" content="{{ .Site.Params.description }}" />
  <meta name="author" content="{{ .Site.Params.author }}" />
  <link rel="icon" href="{{ `favicon.ico` | relURL }}" type="image/x-icon" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  />
  <link
    rel="stylesheet"
    href="//fonts.googleapis.com/css?family=Inter:400,500,600"
  />

  {{ $css := resources.Get "main.css" | css.TailwindCSS }}
  {{ if hugo.IsProduction }}
  {{ with $css | minify | fingerprint }}
  <link
    rel="stylesheet"
    href="{{ .RelPermalink }}"
    integrity="{{ .Data.Integrity | safeHTMLAttr }}"
    crossorigin="anonymous"
  />
  {{ end }} {{ else}}
  <link href="{{ $css.RelPermalink }}" rel="stylesheet" />
  {{ end }}

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    .panel {
      max-height: 0;
      transition: max-height 0.3s ease-out;
    }

    .panel > .panel-reveal > * {
      opacity: 0;
      transform: translateY(8px);
    }
    .panel > .panel-reveal.revealed > * {
      opacity: 1;
      transform: translateY(0);
    }

    .profile-photo-container img {
      max-width: 100%;
    }

    .pagefind-ui__search-clear {
      display: none;
    }
  </style>

  <script>
    const expandAccordion = (elem) => {
      const allPanels = Array.from(document.querySelectorAll(".panel"));
      const allAccordion = Array.from(document.querySelectorAll(".accordion"));
      const clicked = elem.parentElement;

      if (clicked.classList.contains("active")) {
        clicked.classList.remove("active");
        clicked.nextElementSibling.style.maxHeight = null;
        const reveal = clicked.nextElementSibling.querySelector(".panel-reveal");
        if (reveal) reveal.classList.remove("revealed");
        return;
      }

      allAccordion.forEach((acc) => {
        acc.classList.remove("active");
      });
      clicked.classList.add("active");
      allPanels.forEach(function (panel) {
        panel.style.maxHeight = null;
        const reveal = panel.querySelector(".panel-reveal");
        if (reveal) reveal.classList.remove("revealed");
      });
      let activePanel = clicked.nextElementSibling;

      if (
        activePanel.id != "skill-panel" &&
        document.querySelector("#skill-panel")
      ) {
        let skillBars = Array.from(
          document.querySelectorAll("#skill-percent")
        );
        skillBars.forEach((bar) => {
          bar.style.width = "0";
        });
      }

      activePanel.style.maxHeight = activePanel.scrollHeight + "px";

      const reveal = activePanel.querySelector(".panel-reveal");
      if (reveal) {
        requestAnimationFrame(() => {
          reveal.classList.add("revealed");
        });
      }

      if (activePanel.id === "skill-panel") {
        const skillBars = activePanel.querySelectorAll("#skill-percent");
        skillBars.forEach((bar, i) => {
          bar.style.width = "0";
          setTimeout(() => {
            bar.style.width = bar.dataset.width;
          }, 100 + i * 80);
        });
      }
    };

    const toggleRole = (btn) => {
      const wrapper = btn.closest(".relative");
      const bubble = wrapper.querySelector(".role-bubble");
      if (!bubble) return;
      const isShown = bubble.style.opacity === "1";
      document.querySelectorAll(".role-bubble").forEach(b => {
        b.style.opacity = "0";
        b.style.transform = "translateX(-50%) scale(0.95)";
      });
      if (!isShown) {
        bubble.style.opacity = "1";
        bubble.style.transform = "translateX(-50%) scale(1)";
      }
    };

    const closeAllRoles = () => {
      document.querySelectorAll(".role-bubble").forEach(b => {
        b.style.opacity = "0";
        b.style.transform = "translateX(-50%) scale(0.95)";
      });
    };

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".role-bubble") && !e.target.matches("[onclick*='toggleRole']")) {
        closeAllRoles();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAllRoles();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const reveals = document.querySelectorAll(".reveal, .blog-entry");
      if (reveals.length === 0) return;

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.1, rootMargin: "0px 0px -20px 0px" }
      );

      reveals.forEach((el) => observer.observe(el));
    });
  </script>

  <script>
    let html = document.querySelector("html");
    let theme = window.localStorage.getItem("theme");
    const configTheme = "{{ .Site.Params.theme.mainTheme }}";

    const setTheme = (theme) => {
      html.classList.remove("light");
      if (theme === "dark") {
        html.classList.add("dark");
        window.localStorage.setItem("theme", "dark");
      } else {
        html.classList.remove("dark");
        window.localStorage.setItem("theme", "light");
      }
      fixThemeToggleIcon(theme);
    };

    const fixThemeToggleIcon = (theme) => {
      let themeToggle = document.querySelector(".theme-toggle i");
      if (themeToggle) {
        themeToggle.className = theme === "dark" ? "bi bi-sun text-sm" : "bi bi-moon text-sm";
      }
    };

    if (theme == null || (configTheme && !window.localStorage.getItem("theme"))) {
      theme = configTheme || "dark";
    }

    setTheme(theme);

    const toggleTheme = () => {
      html.classList.contains("dark") ? setTheme("light") : setTheme("dark");
    };

    window.onload = () => {
      fixThemeToggleIcon(theme);
      let defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";

        const reveal = defaultActivePanel.nextElementSibling.querySelector(".panel-reveal");
        if (reveal) {
          requestAnimationFrame(() => reveal.classList.add("revealed"));
        }

        if (defaultActivePanel.nextElementSibling.id === "skill-panel") {
          const skillBars = defaultActivePanel.nextElementSibling.querySelectorAll("#skill-percent");
          skillBars.forEach((bar, i) => {
            setTimeout(() => { bar.style.width = bar.dataset.width; }, 200 + i * 80);
          });
        }
      }
    };

    window.onresize = () => {
      let defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }
    };
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("typed-tagline");
      if (!el) return;
      const phrases = ["Hi", "Hello", "Welcome :)"];
      let phraseIdx = 0, charIdx = 0, isDeleting = false;
      const type = () => {
        const current = phrases[phraseIdx];
        if (!isDeleting) {
          el.textContent = current.substring(0, charIdx + 1);
          charIdx++;
          if (charIdx === current.length) {
            setTimeout(() => { isDeleting = true; type(); }, 1800);
            return;
          }
          setTimeout(type, 70);
        } else {
          el.textContent = current.substring(0, charIdx - 1);
          charIdx--;
          if (charIdx === 0) {
            isDeleting = false;
            phraseIdx = (phraseIdx + 1) % phrases.length;
            setTimeout(type, 400);
            return;
          }
          setTimeout(type, 40);
        }
      };
      type();
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".star-count").forEach(el => {
        const repo = el.dataset.repo;
        if (!repo) return;
        fetch("https://corsproxy.io/?" + encodeURIComponent("https://api.github.com/repos/" + repo))
          .then(r => r.json())
          .then(data => {
            if (data.stargazers_count !== undefined) {
              el.textContent = "★ " + data.stargazers_count;
            }
          })
          .catch(() => {});
      });
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("wakatime-stats");
      if (!el) return;
      fetch("https://chalisehari.com.np/api/wakatime")
        .then(r => r.json())
        .then(data => {
          const d = data.data;
          if (!d) { el.innerHTML = '<span class="italic">No data this week</span>'; return; }
          const total = d.total_seconds || 0;
          const hours = Math.floor(total / 3600);
          const mins = Math.floor((total % 3600) / 60);
          let html = '<div class="text-stone-600 dark:text-stone-300 mb-2"><span class="font-semibold text-stone-700 dark:text-stone-200">' + hours + 'h ' + mins + 'm</span> total</div>';
          const sections = [
            { key: "languages", label: "Languages" },
            { key: "editors", label: "Editors" },
            { key: "operating_systems", label: "OS" },
            { key: "projects", label: "Projects" }
          ];
          sections.forEach(s => {
            const items = d[s.key];
            if (!items || items.length === 0) return;
            html += '<div class="mb-1.5"><span class="text-[10px] text-stone-400 dark:text-stone-500 uppercase tracking-wider">' + s.label + '</span><div class="flex flex-wrap gap-1 mt-0.5">';
            items.slice(0, 5).forEach(item => {
              html += '<span class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded bg-stone-100 dark:bg-neutral-800 text-stone-600 dark:text-stone-400"><span class="w-1.5 h-1.5 rounded-full bg-stone-400 dark:bg-stone-500"></span>' + item.name + '</span>';
            });
            html += '</div></div>';
          });
          el.innerHTML = html;
          el.classList.remove("italic", "text-stone-400", "dark:text-stone-500");
          el.classList.add("text-xs");
        })
        .catch(() => { el.innerHTML = '<span class="italic">Wakatime unavailable</span>'; });
    });
  </script>

  <script>
    const showToast = (msg) => {
      let toast = document.getElementById("copy-toast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "copy-toast";
        toast.className = "toast";
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".email-copy").forEach(el => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          const email = el.dataset.email;
          navigator.clipboard.writeText(email).then(() => {
            showToast("Email copied to clipboard!");
          }).catch(() => {
            showToast("Failed to copy email");
          });
        });
      });
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const bar = document.getElementById("home-progress");
      if (!bar) return;
      window.addEventListener("scroll", () => {
        const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        bar.style.width = progress + "%";
      }, { passive: true });
    });
  </script>


</head>
