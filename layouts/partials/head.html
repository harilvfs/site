<head>
  {{ if .IsHome }}
  <title>{{ .Site.Title }}</title>
  {{ else }}
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  {{ end }}
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  />
  <meta name="theme-color" content="" />
  <meta name="description" content="{{ .Site.Params.description }}" />
  <meta name="author" content="{{ .Site.Params.author }}" />

  <meta property="og:site_name" content="{{ .Site.Title }}" />
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}" />
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}" />
  <meta property="og:url" content="{{ .Permalink }}" />
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
  <meta property="og:image" content="{{ "images/profile.jpg" | absURL }}" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}" />
  <meta name="twitter:description" content="{{ .Description | default .Site.Params.description }}" />
  <meta name="twitter:image" content="{{ "images/profile.jpg" | absURL }}" />
  <link rel="icon" href="{{ `favicon.ico` | relURL }}" type="image/x-icon" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  />
  <link
    rel="stylesheet"
    href="//fonts.googleapis.com/css?family=Inter:400,500,600"
  />

  {{ $css := resources.Get "main.css" | css.TailwindCSS }}
  {{ if hugo.IsProduction }}
  {{ with $css | minify | fingerprint }}
  <link
    rel="stylesheet"
    href="{{ .RelPermalink }}"
    integrity="{{ .Data.Integrity | safeHTMLAttr }}"
    crossorigin="anonymous"
  />
  {{ end }} {{ else}}
  <link href="{{ $css.RelPermalink }}" rel="stylesheet" />
  {{ end }}

  {{ $legacy := resources.Get "legacy.css" }}
  <link rel="stylesheet" href="{{ $legacy.RelPermalink }}" />

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    .panel {
      max-height: 0;
      transition: max-height 0.3s ease-out;
    }

    .panel > .panel-reveal > * {
      opacity: 0;
      transform: translateY(8px);
    }
    .panel > .panel-reveal.revealed > * {
      opacity: 1;
      transform: translateY(0);
    }

    .profile-photo-container img {
      max-width: 100%;
    }

    .pagefind-ui__search-clear {
      display: none;
    }
  </style>

  <script>
    function expandAccordion(elem) {
      var allPanels = document.querySelectorAll(".panel");
      var allAccordion = document.querySelectorAll(".accordion");
      var clicked = elem.parentElement;

      if (clicked.classList.contains("active")) {
        clicked.classList.remove("active");
        clicked.nextElementSibling.style.maxHeight = null;
        var reveal = clicked.nextElementSibling.querySelector(".panel-reveal");
        if (reveal) reveal.classList.remove("revealed");
        return;
      }

      for (var i = 0; i < allAccordion.length; i++) {
        var acc = allAccordion[i];
        acc.classList.remove("active");
      }
      clicked.classList.add("active");
      for (var j = 0; j < allPanels.length; j++) {
        var panel = allPanels[j];
        panel.style.maxHeight = null;
        var reveal = panel.querySelector(".panel-reveal");
        if (reveal) reveal.classList.remove("revealed");
      }
      var activePanel = clicked.nextElementSibling;

      if (
        activePanel.id != "skill-panel" &&
        document.querySelector("#skill-panel")
      ) {
        var skillBars = document.querySelectorAll("#skill-percent");
        for (var k = 0; k < skillBars.length; k++) skillBars[k].style.width = "0";
      }

      activePanel.style.maxHeight = activePanel.scrollHeight + "px";

      var reveal = activePanel.querySelector(".panel-reveal");
      if (reveal) {
        reveal.classList.add("revealed");
      }

      if (activePanel.id === "skill-panel") {
        var skillBars = activePanel.querySelectorAll("#skill-percent");
        for (var i = 0; i < skillBars.length; i++) (function(bar, index) {
          bar.style.width = "0";
          setTimeout(function() {
            bar.style.width = bar.dataset.width;
          }, 100 + index * 80);
        })(skillBars[i], i);
      }
    }

    function toggleRole(btn) {
      var wrapper = btn.parentNode;
      while (wrapper && !(" " + wrapper.className + " ").match(/ relative /)) wrapper = wrapper.parentNode;
      if (!wrapper) return;
      var bubble = wrapper.querySelector(".role-bubble");
      if (!bubble) return;
      var isShown = bubble.style.opacity === "1";
      var bubbles = document.querySelectorAll(".role-bubble");
      for (var i = 0; i < bubbles.length; i++) {
        var b = bubbles[i];
        b.style.opacity = "0";
        b.style.transform = "translateX(-50%) scale(0.95)";
      }
      if (!isShown) {
        bubble.style.opacity = "1";
        bubble.style.transform = "translateX(-50%) scale(1)";
      }
    }

    function closeAllRoles() {
      var bubbles = document.querySelectorAll(".role-bubble");
      for (var i = 0; i < bubbles.length; i++) {
        var b = bubbles[i];
        b.style.opacity = "0";
        b.style.transform = "translateX(-50%) scale(0.95)";
      }
    }

    document.addEventListener("click", function(e) {
      var target = e.target;
      while (target && target !== document && !(" " + target.className + " ").match(/ role-bubble /)) target = target.parentNode;
      if (!target || target === document) {
        var button = e.target;
        while (button && button !== document && !(button.getAttribute && (button.getAttribute("onclick") || "").indexOf("toggleRole") >= 0)) button = button.parentNode;
        if (!button || button === document) closeAllRoles();
      }
    });

    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape" || e.keyCode === 27) closeAllRoles();
    });

    document.addEventListener("DOMContentLoaded", function() {
      var reveals = document.querySelectorAll(".reveal, .blog-entry");
      if (!window.IntersectionObserver) {
        for (var i = 0; i < reveals.length; i++) reveals[i].classList.add("visible");
        return;
      }
      var observer = new IntersectionObserver(function(entries) {
        for (var i = 0; i < entries.length; i++) if (entries[i].isIntersecting) {
          entries[i].target.classList.add("visible"); observer.unobserve(entries[i].target);
        }
      }, { threshold: 0.1, rootMargin: "0px 0px -20px 0px" });
      for (var i = 0; i < reveals.length; i++) observer.observe(reveals[i]);
    });
  </script>

  <script>
    var html = document.querySelector("html");
    function getStoredTheme() { try { return window.localStorage.getItem("theme"); } catch (e) { return null; } }
    function storeTheme(value) { try { window.localStorage.setItem("theme", value); } catch (e) {} }
    var theme = getStoredTheme();
    var configTheme = "{{ .Site.Params.theme.mainTheme }}";

    function setTheme(theme) {
      html.classList.remove("light");
      if (theme === "dark") {
        html.classList.add("dark");
        storeTheme("dark");
      } else {
        html.classList.remove("dark");
        storeTheme("light");
      }
      fixThemeToggleIcon(theme);
    }

    function fixThemeToggleIcon(theme) {
      var themeToggle = document.querySelector(".theme-toggle i");
      if (themeToggle) {
        themeToggle.className = theme === "dark" ? "bi bi-sun text-sm" : "bi bi-moon text-sm";
      }
    }

    if (theme == null) {
      theme = configTheme || "dark";
    }

    setTheme(theme);

    function toggleTheme() {
      html.classList.contains("dark") ? setTheme("light") : setTheme("dark");
    }

    window.onload = function() {
      fixThemeToggleIcon(theme);
      var defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";

        var reveal = defaultActivePanel.nextElementSibling.querySelector(".panel-reveal");
        if (reveal) {
          reveal.classList.add("revealed");
        }

        if (defaultActivePanel.nextElementSibling.id === "skill-panel") {
          var skillBars = defaultActivePanel.nextElementSibling.querySelectorAll("#skill-percent");
          for (var i = 0; i < skillBars.length; i++) (function(bar, index) { setTimeout(function() { bar.style.width = bar.getAttribute("data-width"); }, 200 + index * 80); })(skillBars[i], i);
        }
      }
    };

    window.onresize = function() {
      var defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }
    };
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var el = document.getElementById("typed-tagline");
      if (!el) return;
      var phrases = ["Hi", "Hello", "Welcome :)"];
      var phraseIdx = 0, charIdx = 0, isDeleting = false;
      function type() {
        var current = phrases[phraseIdx];
        if (!isDeleting) {
          el.textContent = current.substring(0, charIdx + 1);
          charIdx++;
          if (charIdx === current.length) {
            setTimeout(function() { isDeleting = true; type(); }, 1800);
            return;
          }
          setTimeout(type, 70);
        } else {
          el.textContent = current.substring(0, charIdx - 1);
          charIdx--;
          if (charIdx === 0) {
            isDeleting = false;
            phraseIdx = (phraseIdx + 1) % phrases.length;
            setTimeout(type, 400);
            return;
          }
          setTimeout(type, 40);
        }
      };
      type();
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var stars = document.querySelectorAll(".star-count");
      for (var i = 0; i < stars.length; i++) (function(el) {
        var repo = el.getAttribute("data-repo");
        if (!repo || !window.fetch) return;
        fetch("https://chalisehari.com.np/api/github-stars?repo=" + encodeURIComponent(repo))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.stars !== undefined) {
              el.textContent = "\u2605 " + data.stars;
            }
          })
          .catch(function() {});
      })(stars[i]);
    });
  </script>

  <script>
    function showToast(msg) {
      var toast = document.getElementById("copy-toast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "copy-toast";
        toast.className = "toast";
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(function() { toast.classList.remove("show"); }, 2000);
    }

    document.addEventListener("DOMContentLoaded", function() {
      var emails = document.querySelectorAll(".email-copy");
      for (var i = 0; i < emails.length; i++) (function(el) {
        el.addEventListener("click", function(e) {
          e.preventDefault();
          var email = el.getAttribute("data-email");
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(email).then(function() { showToast("Email copied to clipboard!"); }, function() { showToast("Email: " + email); });
          else { var input = document.createElement("textarea"); input.value = email; document.body.appendChild(input); input.select(); try { document.execCommand("copy"); showToast("Email copied to clipboard!"); } catch (err) { showToast("Email: " + email); } document.body.removeChild(input); }
        });
      })(emails[i]);
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var bar = document.getElementById("home-progress");
      if (!bar) return;
      window.addEventListener("scroll", function() {
        var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        bar.style.width = progress + "%";
      }, { passive: true });
    });
  </script>


</head>
