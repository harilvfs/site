<div id="giscus-comments" class="mt-12 pt-8 border-t border-stone-200 dark:border-neutral-800"></div>

<script>
  const giscusTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';

  const script = document.createElement('script');
  script.src = 'https://giscus.app/client.js';
  script.setAttribute('data-repo', 'harilvfs/site');
  script.setAttribute('data-repo-id', 'R_kgDORWJmJA');
  script.setAttribute('data-category', 'General');
  script.setAttribute('data-category-id', 'DIC_kwDORWJmJM4C_z50');
  script.setAttribute('data-mapping', 'pathname');
  script.setAttribute('data-strict', '0');
  script.setAttribute('data-reactions-enabled', '1');
  script.setAttribute('data-emit-metadata', '0');
  script.setAttribute('data-input-position', 'top');
  script.setAttribute('data-theme', giscusTheme);
  script.setAttribute('data-lang', 'en');
  script.crossOrigin = 'anonymous';
  script.async = true;
  document.getElementById('giscus-comments').appendChild(script);

  const sendTheme = (theme) => {
    const iframe = document.querySelector('#giscus-comments iframe');
    if (iframe) {
      iframe.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, 'https://giscus.app');
    }
  };

  const observer = new MutationObserver(() => {
    const isDark = document.documentElement.classList.contains('dark');
    sendTheme(isDark ? 'dark' : 'light');
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
</script>
